<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Private Tab</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <!-- Shares the cinematic new-tab layout (scene · stage · glass search) so the
       private page is structurally identical; the overrides below give it its
       violet private-mode identity. -->
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Private identity: violet veil + accent, and the "Private" marker. */
    .scene-veil {
      background:
        linear-gradient(180deg, rgba(20,10,44,0.62) 0%, rgba(20,10,44,0.20) 32%, rgba(20,10,44,0.16) 60%, rgba(20,10,44,0.78) 100%),
        radial-gradient(120% 90% at 50% 8%, rgba(124,58,237,0.28), transparent 60%);
    }
    .search:focus-within {
      border-color: rgba(167,139,250,0.6);
      box-shadow: 0 10px 40px rgba(0,0,0,0.48), 0 0 0 3px rgba(124,58,237,0.4);
    }
    .private-pill {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #d9c9ff;
      padding: 5px 12px; border-radius: 999px;
      background: rgba(124,58,237,0.22); border: 1px solid rgba(167,139,250,0.4);
      margin-bottom: 16px;
    }
    .private-pill svg { width: 12px; height: 12px; }
    .tagline { color: rgba(220,208,248,0.82); }
  </style>
</head>
<body>
  <div class="scene">
    <div class="scene-img" aria-hidden="true"></div>
    <div class="scene-veil" aria-hidden="true"></div>

    <main class="stage">
      <span class="private-pill">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4z"/></svg>
        Private
      </span>
      <div class="dateline" id="dateline">THURSDAY, JULY 23</div>
      <h1 class="greeting" id="greeting">Good evening.</h1>
      <p class="tagline">Nothing you do here is saved.</p>

      <form class="search" id="search-form" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input class="search-input" id="search-input" type="text" placeholder="Search privately" spellcheck="false">
        <span class="search-kbd" id="search-kbd">⌘K</span>
      </form>
    </main>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
