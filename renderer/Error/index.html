<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Can't reach this page</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; font-family: var(--font);
      background: var(--page); color: var(--text);
      overflow: hidden; -webkit-font-smoothing: antialiased;
      user-select: none; -webkit-user-select: none;
    }

    /* Same token-driven wallpaper as the new-tab: a soft themed gradient. */
    .scene {
      position: fixed; inset: 0; overflow: hidden;
      background:
        radial-gradient(120% 82% at 50% 0%, var(--accent-wash), transparent 60%),
        linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 44%, var(--page) 100%);
    }

    .mark { position: absolute; top: 28px; left: 32px; color: var(--text-3); }

    .stage {
      position: relative; z-index: 1; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 40px; text-align: center;
    }
    .bignum {
      font-family: var(--font); font-weight: 800; font-size: clamp(96px, 16vw, 180px);
      line-height: 0.9; letter-spacing: -0.04em; color: var(--text-3);
    }
    .title {
      font-size: clamp(20px, 2.6vw, 26px); font-weight: 700; letter-spacing: -0.02em;
      margin-top: 18px; color: var(--text);
    }
    .detail { font-size: 14px; color: var(--text-2); margin-top: 10px; max-width: 460px; }
    .url {
      font-family: var(--mono); font-size: 12.5px; color: var(--text-3);
      margin-top: 8px; max-width: 560px; word-break: break-all;
      user-select: text; -webkit-user-select: text;
    }

    .actions { display: flex; gap: 10px; margin-top: 28px; }
    button {
      cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: 600;
      padding: 9px 20px; border-radius: var(--radius); transition: filter 0.15s, background 0.15s, border-color 0.15s;
    }
    .btn-primary { border: 1px solid transparent; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-ghost { border: 1px solid var(--border-2); background: transparent; color: var(--text); }
    .btn-ghost:hover { border-color: var(--text-3); background: var(--hover); }

    .foot {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 0 32px 22px;
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; color: var(--text-3);
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>

  <div class="mark" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="24" cy="24" r="15"/><path d="M12 24h24M24 24l9-9"/></svg>
  </div>

  <main class="stage">
    <div class="bignum" id="bignum">404</div>
    <h1 class="title" id="title">Can't reach this page</h1>
    <p class="detail" id="detail"></p>
    <p class="url" id="url"></p>
    <div class="actions">
      <button class="btn-ghost" id="btn-back">Go Back</button>
      <button class="btn-primary" id="btn-retry">Try Again</button>
    </div>
  </main>

  <div class="foot" aria-hidden="true">
    <span>northstar.browser</span>
    <span>true north, always</span>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const failedUrl = params.get('url') || '';
    const code = params.get('code') || '';
    const desc = params.get('desc') || '';

    if (failedUrl) document.getElementById('url').textContent = failedUrl;

    const messages = {
      '-2':   ['No internet connection', 'Check your network connection and try again.'],
      '-3':   ['Host not found', 'The DNS lookup for this site failed.'],
      '-6':   ['Connection refused', 'The site actively refused the connection.'],
      '-7':   ['Timed out', 'The connection took too long to respond.'],
      '-21':  ['Network changed', 'Your network changed while loading. Try again.'],
      '-100': ['No internet', 'There is no internet connection.'],
      '-101': ['Connection refused', 'The site refused the connection.'],
      '-102': ['Connection reset', 'The connection was reset.'],
      '-105': ['Host not found', 'The DNS lookup for this site failed.'],
      '-106': ['Internet disconnected', 'No internet connection is available.'],
      '-109': ['Address unreachable', 'The address is not reachable.'],
      '-118': ['Connection timed out', 'The connection timed out.'],
      '-137': ['Network access denied', 'Your browser does not have network access.'],
      '-300': ['Invalid URL', 'The URL is not valid.'],
      '-310': ['Too many redirects', 'The page has too many redirects.'],
      '-324': ['Empty response', 'The server sent an empty response.'],
      '-501': ['Insecure connection', 'This site uses an insecure connection.'],
    };

    const [title, detail] = messages[code] || ["Can't reach this page", desc || 'Something went wrong loading this page.'];
    document.getElementById('title').textContent = title;
    document.getElementById('detail').textContent = detail;
    document.title = title;

    // Use the tab's navigation API (available via preload) instead of window history
    document.getElementById('btn-retry').addEventListener('click', () => {
      if (failedUrl) window.electronAPI.navigateActiveTab(failedUrl);
    });
    document.getElementById('btn-back').addEventListener('click', () => {
      window.electronAPI.activeTabGoBack();
    });
  </script>
</body>
</html>
