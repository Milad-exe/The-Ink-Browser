<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Palette</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Full-window transparent surface: a click that misses the card dismisses. -->
  <div id="surface">
    <div id="card" role="dialog" aria-label="Open a page">
      <div id="field">
        <svg id="glyph" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input id="q" type="text" placeholder="Search with Google or enter address" autocomplete="off" spellcheck="false">
      </div>
      <div id="results" role="listbox"></div>
    </div>
  </div>
  <script src="palette.js"></script>
</body>
</html>
