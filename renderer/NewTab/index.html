<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>New Tab</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="styles.css">
</head>
<!--
  A blank tab is not a destination.

  This used to be a page in its own right — wallpaper, greeting, clock, its own
  search field — which meant every new tab took you somewhere before you had
  said where you wanted to go, and gave you a SECOND search box competing with
  the address bar. Opening a tab now raises the palette (ipc/palette.js), and
  what is behind it is deliberately almost nothing: the page card in the theme's
  own colour, holding the space until a real page arrives.

  What is left is a single line telling you which key brings the palette back if
  you dismissed it, faded down so it reads as a caption rather than as content.
-->
<body>
  <main class="rest">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="24" cy="24" r="15"/><path d="M12 24h24M24 24l9-9"/>
      </svg>
    </div>
    <p class="hint" id="hint"></p>
  </main>
  <script src="../lib/i18n.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
