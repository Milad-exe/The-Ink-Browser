<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>New Tab</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene">
    <div class="scene-img" aria-hidden="true"></div>
    <div class="scene-veil" aria-hidden="true"></div>

    <main class="stage">
      <div class="dateline" id="dateline">THURSDAY, JULY 23</div>
      <h1 class="greeting" id="greeting">Good evening.</h1>
      <p class="wordmark" aria-label="Northstar"><img class="brand-logo" src="../assets/icon.png" alt="">orthstar</p>

      <form class="search" id="search-form" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input class="search-input" id="search-input" type="text" placeholder="Search the web or enter an address" spellcheck="false">
      </form>
    </main>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
