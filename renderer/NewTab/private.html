<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Private Tab</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Same quiet surface as a normal blank tab (see index.html) — only the
       light is violet, and a marker names the mode. A private tab that looked
       like a different product made "am I private?" a question about styling
       rather than about the one label that answers it. */
    @layer components {
      .rest { background: radial-gradient(120% 70% at 50% 32%, rgba(124,58,237,0.16), transparent 62%); }
      .mark { color: #a78bfa; opacity: 0.34; }
      .private-pill {
        display: inline-flex; align-items: center; gap: var(--sp-3);
        font-family: var(--mono); font-size: var(--fs-micro); font-weight: 700;
        letter-spacing: 0.16em; text-transform: uppercase;
        color: #cbb6ff; padding: 4px var(--sp-4); border-radius: var(--r-pill);
        background: rgba(124,58,237,0.16);
        box-shadow: inset 0 0 0 0.5px rgba(167,139,250,0.35);
        animation: rest-in 420ms var(--ease) both;
      }
      .private-pill svg { width: 12px; height: 12px; }
    }
  </style>
</head>
<body>
  <main class="rest">
    <span class="private-pill">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4z"/></svg>
      <span data-i18n="chrome.private">Private</span>
    </span>
    <p class="hint" id="hint"></p>
  </main>
  <script src="../lib/i18n.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
