<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline';" />
  <title>Northstar</title>
  <style>
    /* The first-launch window. It is the app icon, enlarged and alive: the same
       fixed palette (#2d6ad6 field, white mark) the dock icon uses, so what
       opens is recognisably the thing that was clicked. Deliberately NOT
       theme-aware — the icon is fixed everywhere by design, and this is the
       product introducing itself rather than a piece of chrome. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      -webkit-user-select: none; user-select: none;
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    @font-face {
      font-family: 'Onest'; font-style: normal; font-weight: 100 900; font-display: block;
      src: url('../assets/fonts/onest-latin.woff2') format('woff2');
    }
    body { display: flex; align-items: center; justify-content: center; }

    .card {
      width: 300px; height: 300px; border-radius: 68px;
      background: #2d6ad6;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px;
      opacity: 0; transform: scale(0.94);
      animation: card-in 420ms cubic-bezier(.2,.7,.3,1) forwards;
    }
    .card.out { animation: card-out 340ms cubic-bezier(.4,0,.7,.2) forwards; }

    .mark { width: 132px; height: 132px; overflow: visible; }
    /* The needle finds north, then the star arrives around it and the needle
       goes — it is the gesture, not part of the mark. The top arm being the
       longest is what gives this star a north; the motion says so. */
    .needle {
      stroke: #fff; stroke-width: 34; stroke-linecap: round;
      stroke-dasharray: 450; stroke-dashoffset: 450;
      animation: draw 520ms cubic-bezier(.2,.7,.3,1) 220ms forwards,
                 fade-out 240ms linear 700ms forwards;
    }
    .star {
      fill: #fff; opacity: 0; transform-origin: 512px 512px;
      animation: settle 460ms cubic-bezier(.2,.7,.3,1) 660ms forwards;
    }
    .eye { fill: #2d6ad6; }
    .name {
      font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #fff;
      opacity: 0; animation: rise 400ms cubic-bezier(.2,.7,.3,1) 980ms forwards;
    }

    @keyframes card-in { to { opacity: 1; transform: scale(1); } }
    @keyframes card-out { to { opacity: 0; transform: scale(1.04); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade-out { to { opacity: 0; } }
    @keyframes settle { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .card, .star, .name { animation: none; opacity: 1; transform: none; }
      .needle { animation: none; opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true">
      <line class="needle" x1="512" y1="512" x2="512" y2="62"/>
      <g class="star">
        <path d="M496.0 95.8Q512.0 50.0 528.0 95.8Q564.1 169.0 581.4 248.7Q599.6 300.6 653.1 288.2Q686.8 270.2 724.9 271.5Q760.9 263.1 752.5 299.1Q753.8 337.2 735.8 370.9Q723.4 424.4 772.6 449.0Q822.1 462.6 862.8 493.9Q899.2 512.0 862.8 530.1Q822.1 561.4 772.6 575.0Q723.4 599.6 735.8 653.1Q753.8 686.8 752.5 724.9Q760.9 760.9 724.9 752.5Q686.8 753.8 653.1 735.8Q599.6 723.4 574.8 772.5Q561.3 821.2 530.2 860.9Q512.0 897.0 493.8 860.9Q462.7 821.2 449.2 772.5Q424.4 723.4 370.9 735.8Q337.2 753.8 299.1 752.5Q263.1 760.9 271.5 724.9Q270.2 686.8 288.2 653.1Q300.6 599.6 251.4 575.0Q201.9 561.4 161.2 530.1Q124.8 512.0 161.2 493.9Q201.9 462.6 251.4 449.0Q300.6 424.4 288.2 370.9Q270.2 337.2 271.5 299.1Q263.1 263.1 299.1 271.5Q337.2 270.2 370.9 288.2Q424.4 300.6 442.6 248.7Q459.9 169.0 496.0 95.8Z"/>
        <rect class="eye" x="408.8" y="436.4" width="64.8" height="91.2" rx="32.4"/>
        <rect class="eye" x="550.4" y="436.4" width="64.8" height="91.2" rx="32.4"/>
      </g>
    </svg>
    <div class="name">Northstar</div>
  </div>
  <script>
    /* Hold on the finished mark, then hand over. The window is closed by main
       either when this says so or when its own timeout fires, so a stalled
       animation can never keep the browser behind a splash screen. */
    const HOLD = matchMedia('(prefers-reduced-motion: reduce)').matches ? 700 : 1550;
    setTimeout(() => {
      document.getElementById('card').classList.add('out');
      setTimeout(() => { try { window.splash && window.splash.done(); } catch (e) { } }, 300);
    }, HOLD);
  </script>
</body>
</html>
