<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Glance</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="m-0 select-none overflow-hidden bg-transparent font-sans text-primary">
  <div id="bar" class="flex h-screen items-center gap-2">
    <span id="label" class="font-mono text-[10px] font-bold uppercase tracking-[0.14em] text-tertiary">Glance</span>
    <span id="host" class="truncate text-[12px] text-secondary"></span>
    <span class="flex-1"></span>
    <button id="open-tab" tabindex="-1" title="Open as a full tab (⌘↵)"
            class="cursor-pointer border-0 bg-transparent text-[11px] font-medium text-accent">Open as tab</button>
    <button id="close-btn" tabindex="-1" title="Close (Esc)"
            class="cursor-pointer border-0 bg-transparent p-0 text-[13px] leading-none text-tertiary hover:text-primary">✕</button>
  </div>
  <script src="bar.js"></script>
</body>
</html>
