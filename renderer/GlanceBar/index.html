<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Glance</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="m-0 select-none overflow-hidden bg-transparent font-sans text-primary">
  <!-- Two controls only: expand the preview into a real tab, or dismiss it. -->
  <div id="bar" class="flex h-screen items-center">
    <button id="open-tab" tabindex="-1" title="Expand into this tab (⌘↵)" aria-label="Expand into this tab">
      <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 2.5H13.5V6.5"/><path d="M13.5 2.5L8.5 7.5"/>
        <path d="M12.5 10v3a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 13V5A1.5 1.5 0 0 1 3 3.5h3"/>
      </svg>
    </button>
    <button id="close-btn" tabindex="-1" title="Close (Esc)" aria-label="Close">
      <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round">
        <path d="M4 4l8 8M12 4l-8 8"/>
      </svg>
    </button>
  </div>
  <script src="bar.js"></script>
</body>
</html>
