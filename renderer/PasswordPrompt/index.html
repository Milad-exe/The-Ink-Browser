<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Save password</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="card" class="surface-card">
    <div id="head">
      <span id="title">Save password?</span>
      <button id="close" class="surface-icon-btn" title="Not now" aria-label="Close" data-i18n-label="chrome.close">
        <svg viewBox="0 0 20 20" fill="none"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="cred">
      <div id="site"></div>
      <div id="user"></div>
    </div>
    <div id="actions">
      <button id="never" class="btn btn-ghost">Never</button>
      <button id="save" class="btn btn-primary">Save</button>
    </div>
  </div>
  <script src="prompt.js"></script>
</body>
</html>
