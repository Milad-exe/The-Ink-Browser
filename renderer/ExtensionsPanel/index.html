<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Extensions</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="panel" class="surface-card">
    <div class="surface-head">
      <span class="surface-title" data-i18n="chrome.extensions">Extensions</span>
      <button id="close-btn" class="surface-icon-btn" title="Close" data-i18n-title="chrome.close" aria-label="Close" data-i18n-label="chrome.close">
        <svg viewBox="0 0 20 20" fill="none"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="list" class="surface-body surface-scroll"></div>

    <!-- The way to get more extensions -->
    <a id="store-link" class="surface-foot" href="#" data-i18n="ext.store">Find extensions</a>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/keys.js"></script>
  <script src="panel.js"></script>
</body>
</html>
