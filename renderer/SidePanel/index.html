<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Side Panel</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="m-0 select-none overflow-hidden bg-transparent font-sans text-primary">
  <div id="bar" class="flex h-screen items-center justify-between gap-2">
    <span id="title" class="truncate font-mono text-[10px] font-bold uppercase tracking-[0.14em] text-secondary">Side Panel</span>
    <button id="close-btn" tabindex="-1" title="Close panel"
            class="cursor-pointer border-0 bg-transparent p-0 text-[13px] leading-none text-tertiary hover:text-primary">✕</button>
  </div>
  <script src="panel.js"></script>
</body>
</html>
