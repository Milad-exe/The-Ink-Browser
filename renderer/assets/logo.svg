<!--
  Northstar — the browser's mark.

  ONE shape, drawn as a character. An eight-point star with a north: the top
  arm is longest (462 from centre), then the bottom (385), then the sides
  (387), then the diagonals (352). Tips and waists carry a radius — 10.5% of
  the arm, so a short arm is as keen as a long one — and every edge bellies OUT
  by 9 units, so it reads as drawn rather than plotted. Convex only: a
  concave-sided star is a sparkle, and that is somebody else's mark (Gemini's).
  Not a compass rose (Safari's), not a crescent, and not line art — thin
  strokes die at the 16px a dock actually renders.

  The body is deliberately FULL. Long thin arms on a wide waist measured fine
  but dissolved below 32px, so the diagonals were grown from 240 to 352 and the
  waist from 158 to 229. The cost is the north: at a 1.31 ratio between the top
  arm and the diagonals it reads closer to a burst than to a compass, and
  pushing the diagonals any further collapses it into a sun. This is the far
  end of that range, not a midpoint — grow it again and there is no star left.

  The eyes are cut to the FIELD colour, never a third one: two small saturated
  ovals on a face read as menacing rather than friendly, which is why this
  idiom always shows the ground through the eyes. They are painted rather than
  knocked out because every theme's field is a flat fill, which makes the two
  identical; give a theme a gradient ground and these must become holes in the
  mark path instead. Width, height and the gap all scale together (this is the
  base pair at ×1.20) — scaling only the width gives you a squint.

  COLOUR COMES FROM THE THEME. The two custom properties below are the whole
  palette, and the values here are Slate (the default). features/app-icon.js
  swaps which of icons/themes/<theme>.png the dock shows when the setting
  changes.

  THE BINARIES ARE CHECKED IN AND ARE NOT GENERATED FROM THIS FILE ANY MORE.
  The rasteriser (scripts/build-icons.js) has been removed, so editing the
  geometry below changes nothing a user sees until icons/themes/*.png,
  logo.png, logo-win.png and icons/icon.{png,ico,icns} are rebuilt by hand.
  Everything that generator knew is recorded here so it can be redone:

    ground / ink per theme, read off renderer/styles/themes.css —
      default   #0a0a0b / #fafafa   (--shell / --text)
      fathom    #0a1420 / #e2eaf4   (--page  / --text)
      porcelain #e8e9ec / #16171a   (--shell / --text)
      dune      #efe1c6 / #122c63   (--shell / --text)

    the runtime PNGs are the art at 824 inside a transparent 1024 — the macOS
    icon safe area. A full-bleed PNG handed to dock.setIcon renders edge to
    edge, visibly LARGER than the bundle icon, which is what used to make the
    dock icon "expand" as the app finished launching. logo-win.png is 940 in
    1024 instead: Windows renders it smaller in the taskbar cell and does not
    mask it. The bundle icon is full-bleed and always built from `default`,
    because a .icns cannot change at runtime.

    render at 2048 and downsample — edges stay sharp. .ico needs 16/24/32/48/
    64/128/256 baked in; letting Windows scale a 1024 down to 16 turns it to
    mush.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <style>
    :root { --icon-field: #0a0a0b; --icon-mark: #fafafa; }
    .field { fill: var(--icon-field); }
    .mark  { fill: var(--icon-mark); }
    .eye   { fill: var(--icon-field); }
  </style>
