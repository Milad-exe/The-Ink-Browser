<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Page actions</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="../styles/surface.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The toolbar's page-scoped actions, collapsed into one panel.

       The utility bar carried eight trailing icons, most of which are about
       THIS PAGE rather than about the browser — and several of which are hidden
       until they apply, so the row silently changed width as you browsed. They
       live here now behind one button, which is what the browsers this design
       follows do: the bar keeps what is always true (who you are, the menu),
       and the page's own actions are one press away.

       Order matters: the four things you DO to a page first, then extensions
       (which act on it), then what the page IS. -->
  <div class="surface-card" id="panel">
    <div class="pa-actions" id="pa-actions" role="group" aria-label="Page actions">
      <button class="pa-btn" id="pa-share" type="button" title="Copy link" aria-label="Copy link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8.5 7.5 12 4l3.5 3.5"/><path d="M5 13v5.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>
      </button>
      <button class="pa-btn" id="pa-reader" type="button" title="Reader view" aria-label="Reader view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg>
      </button>
      <button class="pa-btn" id="pa-pip" type="button" title="Picture-in-Picture" aria-label="Picture-in-Picture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12.5" y="11.5" width="6.5" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="pa-btn" id="pa-bookmark" type="button" title="Bookmark" aria-label="Bookmark">
        <svg class="bm-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1z"/></svg>
        <svg class="bm-filled" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1z"/></svg>
      </button>
    </div>

    <div class="pa-sep"></div>

    <button class="pa-row" id="pa-extensions" type="button">
      <span class="pa-row-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
      </span>
      <span class="pa-label">Extensions</span>
    </button>
    <button class="pa-row" id="pa-downloads" type="button">
      <span class="pa-row-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10M8 10.5l4 4 4-4"/><path d="M5 19.5h14"/></svg>
      </span>
      <span class="pa-label">Downloads</span>
    </button>
    <button class="pa-row" id="pa-focus" type="button">
      <span class="pa-row-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg>
      </span>
      <span class="pa-label">Focus mode</span>
    </button>

    <div class="pa-sep"></div>

    <!-- What the page IS, not what you can do to it — so it reads as a state,
         not another action. Clicking it opens the real site-info panel. -->
    <button class="pa-security" id="pa-security" type="button">
      <span class="pa-sec-icon" aria-hidden="true"></span>
      <span class="pa-sec-text" id="pa-sec-text">Not secure</span>
      <span class="pa-sec-host" id="pa-sec-host"></span>
    </button>
  </div>
  <script src="actions.js"></script>
</body>
</html>
