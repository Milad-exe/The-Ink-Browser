<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
  <title>Northstar</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Tab Bar (top strip — sits beside the native window controls) -->
  <div id="tab-bar">
    <!-- Window controls — position/style set by JS based on platform -->
    <div id="window-controls" class="window-controls"></div>
    <button id="tab-scroll-left" class="tab-scroll-btn" tabindex="-1" aria-label="Scroll tabs left">‹</button>
    <div id="tabs-container"></div>
    <button id="tab-scroll-right" class="tab-scroll-btn" tabindex="-1" aria-label="Scroll tabs right">›</button>
    <div id="tab-actions">
      <button id="new-tab-btn" class="tab-add" tabindex="-1" aria-label="New tab">+</button>
    </div>
    <!-- Draggable filler: keeps the + next to the last tab, taking the slack up
         to the window controls / private badge. Collapses to 0 once tabs fill
         the strip, so the + falls back to the far right. -->
    <div id="tab-drag-spacer"></div>
    <!-- Mono status micro-labels (right of the strip): tab count + clock -->
    <div id="chrome-status" class="chrome-status" aria-hidden="true">
      <span id="chrome-tabs" class="cs-tabs">TABS·1</span>
      <span class="cs-star" aria-hidden="true">✦</span>
      <span id="chrome-clock" class="cs-clock">00:00</span>
    </div>
    <div id="private-window-badge" class="private-badge">
      <svg viewBox="0 0 16 16" width="10" height="10" fill="currentColor"><path d="M8 1L2 3.5V8c0 3.3 2.5 5.7 6 7 3.5-1.3 6-3.7 6-7V3.5L8 1zm0 6.5h4c-.3 2.2-1.8 4-4 5.1V7.5H4V5l4-1.7V7.5z"/></svg>
      Private
    </div>
  </div>

  <!-- Navigation / address bar -->
  <div id="utility-bar">
    <div class="nav-buttons">
      <button id="back-btn" tabindex="-1" class="nav-btn" title="Back">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button id="forward-btn" tabindex="-1" class="nav-btn" title="Forward">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button id="reload-btn" tabindex="-1" class="nav-btn" title="Reload">
        <svg class="nav-reload" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <path d="M21 4v4.2h-4.2"/>
        </svg>
        <svg class="nav-stop" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="omnibox-wrapper">
      <div class="omnibox" data-omni="search">
        <span class="omni-icon" id="omni-icon">
          <!-- Search: shown while typing / on new tab -->
          <svg class="oi oi-search" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="M21 21l-4.3-4.3"/>
          </svg>
          <!-- Secure: HTTPS page -->
          <svg class="oi oi-secure" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="9" rx="2"/>
            <path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>
          </svg>
          <!-- Not secure: HTTP page -->
          <svg class="oi oi-insecure" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.3 3.5 1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.5a2 2 0 0 0-3.4 0z"/>
            <path d="M12 9.5v4M12 17.2h.01"/>
          </svg>
        </span>
        <div class="omni-input">
          <input id="searchBar" placeholder="Search or enter URL" type="text">
          <!-- Firefox-style resting URL: host bright, scheme/path dimmed.
               Painted over the (text-transparent) input while it's unfocused. -->
          <div id="url-display" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <!-- Inline pomodoro pill — hidden until focus mode/timer is active -->
    <div id="pomodoro-pill" class="pomodoro-pill hidden" title="Click to manage timer">
      <svg class="pill-ring" viewBox="0 0 28 28" width="28" height="28">
        <circle class="pill-ring-bg"   cx="14" cy="14" r="11"/>
        <circle class="pill-ring-fill" id="pill-ring-fill" cx="14" cy="14" r="11"/>
      </svg>
      <span class="pill-phase-dot" id="pill-phase-dot"></span>
      <span class="pill-time" id="pill-time">25:00</span>
    </div>

    <div class="trailing-icons">
      <!-- Extension browser-action buttons (electron-chrome-extensions) -->
      <browser-action-list id="ext-actions"></browser-action-list>
      <!-- Extensions: lists installed extensions; links to the Chrome Web Store -->
      <button id="extensions-btn" tabindex="-1" class="icon-btn" title="Extensions">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/>
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>
        </svg>
      </button>
      <!-- Reader mode: hidden until the page looks like an article -->
      <button id="reader-btn" tabindex="-1" class="icon-btn reader-btn hidden" title="Reader View">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2.5"/>
          <path d="M8 9h8M8 12.5h8M8 16h5"/>
        </svg>
      </button>
      <!-- Picture-in-Picture: hidden until the active tab plays video -->
      <button id="pip-btn" tabindex="-1" class="icon-btn pip-btn hidden" title="Picture-in-Picture">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/>
          <rect x="12.5" y="11.5" width="6.5" height="5" rx="1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <!-- Downloads: hidden until the first download of the session -->
      <button id="downloads-btn" tabindex="-1" class="icon-btn downloads-btn hidden" title="Downloads">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v10M8 10.5l4 4 4-4"/>
          <path d="M5 19.5h14"/>
        </svg>
        <span class="downloads-dot"></span>
      </button>
      <!-- Bookmark: filled ribbon when bookmarked, outline when not -->
      <button id="bookmark-btn" tabindex="-1" class="icon-btn" title="Bookmark">
        <svg class="icon-svg bookmark-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1z"/>
        </svg>
        <svg class="icon-svg bookmark-filled" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1z"/>
        </svg>
      </button>
      <!-- Focus: clock icon -->
      <button id="focus-btn" tabindex="-1" class="icon-btn" title="Focus Mode">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="M12 7v5l3.2 2"/>
        </svg>
      </button>
      <button id="menu-btn" tabindex="-1" class="icon-btn menu-btn" title="Menu">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Bookmark Bar -->
  <div id="bookmark-bar" class="bookmark-bar hidden">
    <div id="bookmark-bar-items"></div>
  </div>

  <!-- Content Area -->
  <div id="content-area"></div>

  <!-- Pomodoro Overlay -->
  <div id="pomodoro-overlay" class="pomodoro-overlay hidden">
    <div class="pomodoro-card">
      <div class="pomodoro-phase" id="pomodoro-phase">Focus</div>
      <div class="pomodoro-time" id="pomodoro-time">25:00</div>
      <div class="pomodoro-controls">
        <button id="pomodoro-start" tabindex="-1" class="pom-btn pom-btn-primary">Start</button>
        <button id="pomodoro-skip" tabindex="-1"  class="pom-btn">Skip</button>
        <button id="pomodoro-reset" tabindex="-1" class="pom-btn">Reset</button>
      </div>
      <div class="pomodoro-sessions" id="pomodoro-sessions"></div>
      <button id="pomodoro-close" tabindex="-1" class="pom-close" title="Close">✕</button>
    </div>
  </div>

  <script src="../../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="../renderer.js"></script>
</body>
</html>
