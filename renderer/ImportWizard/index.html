<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none';" />
    <title>Import</title>
    <link rel="stylesheet" href="../styles/ui.css">
    <link rel="stylesheet" href="../styles/surface.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wiz">
        <header class="wiz-head">
            <div>
                <div class="wiz-title">Import your data</div>
                <div class="wiz-sub">Bring bookmarks, history and more from another browser on this computer.</div>
            </div>
            <button class="wiz-x" id="btn-close" title="Close" aria-label="Close">
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z"/></svg>
            </button>
        </header>

        <div class="wiz-body">
            <div id="loading" class="wiz-muted">Looking for installed browsers…</div>
            <div id="src-empty" class="wiz-muted" hidden>
                No other browsers were found on this computer. You can still import from a bookmarks HTML file below.
            </div>

            <div id="src-list" class="src-list" role="radiogroup" aria-label="Browser to import from"></div>

            <section id="types" class="types" hidden>
                <div class="types-label">What to bring over</div>
                <label class="type-row" id="row-bm">
                    <input type="checkbox" id="t-bm"><span class="type-name">Bookmarks</span><span class="type-meta" id="m-bm"></span>
                </label>
                <label class="type-row" id="row-hist">
                    <input type="checkbox" id="t-hist"><span class="type-name">History</span><span class="type-meta" id="m-hist"></span>
                </label>
                <label class="type-row" id="row-eng">
                    <input type="checkbox" id="t-eng"><span class="type-name">Search engines</span><span class="type-meta" id="m-eng"></span>
                </label>
                <label class="type-row" id="row-pw">
                    <input type="checkbox" id="t-pw"><span class="type-name">Passwords</span><span class="type-meta">choose a CSV export</span>
                </label>
            </section>
        </div>

        <footer class="wiz-foot">
            <button class="linkbtn" id="btn-html">Import from an HTML file…</button>
            <div class="foot-actions">
                <button class="wbtn ghost" id="btn-cancel">Cancel</button>
                <button class="wbtn primary" id="btn-import" disabled>Import</button>
            </div>
        </footer>

        <div id="toast" class="wiz-toast" hidden></div>
    </div>
    <script src="wizard.js"></script>
</body>
</html>
